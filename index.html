<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PowerPoint Narrator · iPad</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#162345;background:#f2f5ff}body{margin:0;padding:20px}main{max-width:780px;margin:auto;background:white;border-radius:24px;padding:clamp(22px,5vw,46px);box-shadow:0 10px 45px #18275418}h1{font-size:clamp(30px,5vw,45px);color:#5425b5;line-height:1.2}p,label,select,input,button{font-size:clamp(19px,3vw,25px)}p{line-height:1.5}label{display:block;font-weight:700;margin:24px 0 10px}input,select{box-sizing:border-box;width:100%;padding:16px;border:2px solid #d9dff0;border-radius:13px;background:white}button{margin-top:30px;width:100%;background:#5725b7;color:white;border:0;border-radius:14px;padding:19px;font-weight:700}.small{font-size:17px;color:#566178}.notice{padding:18px;background:#fff7e5;border-left:5px solid #edac2d;border-radius:10px}.hidden{display:none}#status{font-size:21px;color:#255a33;margin-top:20px;white-space:pre-wrap}</style></head><body><main><h1>🎓 PowerPoint Narrator</h1><p>在 iPad Safari 中上传 PPTX、提取讲稿、生成语音并嵌入幻灯片。</p><div class="notice"><strong>测试版说明：</strong>已有音频模式会保留原 PPTX；AI 语音模式可嵌入新音频，但在 iPad PowerPoint 上可能需要点击播放。SayTXT 自动生成/导出尚未接入。</div>
<form id="form"><label for="file">① 上传 PPTX</label><input id="file" name="file" type="file" accept=".pptx" required>
<label for="mode">② 选择模式</label><select id="mode" name="mode"><option value="notes">只提取 Speaker Notes（免费）</option><option value="existing">保留已有音频（免费）</option><option value="tts">AI 批量生成语音并嵌入 PPTX</option></select>
<div id="tts" class="hidden"><label for="voice">AI 声音</label><select id="voice" name="voice"><option>alloy</option><option>nova</option><option>onyx</option><option>echo</option><option>fable</option><option>shimmer</option></select><label for="key">OpenAI API Key（仅本次请求使用）</label><input id="key" name="api_key" type="password" autocomplete="off" placeholder="sk-..."><p class="small">注意：使用 API 可能产生费用。请仅在自己控制的服务端部署；不要把密钥输入陌生公开网站。</p></div>
<label for="limit">③ 处理张数（0 = 全部）</label><input id="limit" name="limit" type="number" min="0" value="0"><button type="submit">开始处理 → 下载结果</button></form><div id="status" role="status"></div><p class="small">支持 Safari / iPadOS。上传文件只在服务器内存中处理，不主动存储；部署服务的日志及主机安全仍需自行管理。</p></main><script>
const form=document.getElementById('form'), mode=document.getElementById('mode'),tts=document.getElementById('tts'),status=document.getElementById('status');mode.onchange=()=>tts.classList.toggle('hidden',mode.value!=='tts');form.onsubmit=async e=>{e.preventDefault();status.textContent='正在上传和处理，请勿关闭网页…';const b=form.querySelector('button');b.disabled=true;try{const r=await fetch('/process',{method:'POST',body:new FormData(form)});if(!r.ok){let x;try{x=(await r.json()).detail}catch{x=await r.text()}throw Error(x)}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=mode.value==='notes'?'slide_notes.txt':mode.value==='tts'?'narrated_ai_voice.pptx':'narrated_existing_audio.pptx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent='✅ 已处理完成！请在 Safari 的下载项目中查看文件。'}catch(e){status.textContent='⚠️ '+e.message}finally{b.disabled=false}};
</script></body></html>
